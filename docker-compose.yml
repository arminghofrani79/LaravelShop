services:

  app:
    build:
      context: ./docker
      dockerfile: Dockerfile

    container_name: laravelshop_app
    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./:/var/www

    depends_on:
      - mysql

    networks:
      - laravelshop


  nginx:
    image: nginx:latest

    container_name: laravelshop_nginx
    restart: unless-stopped

    ports:
      - "8112:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravelshop


  mysql:
    image: mysql:8.4

    container_name: laravelshop_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: laravelshop
      MYSQL_USER: laravelshop
      MYSQL_PASSWORD: laravelshop
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3309:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravelshop


networks:
  laravelshop:
    driver: bridge


volumes:
  mysql_data:
